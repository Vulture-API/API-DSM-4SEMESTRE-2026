global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "vulture-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000", "api-usuario:3000", "vulture-backend:3000"]
        labels:
          environment: "production"
          service: "vulture-backend"
